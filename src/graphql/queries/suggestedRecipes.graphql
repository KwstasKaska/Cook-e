query SuggestedRecipes($ingredientIds: [Int!]!, $utensilIds: [Int!]) {
  suggestedRecipes(ingredientIds: $ingredientIds, utensilIds: $utensilIds) {
    recipe {
      ...RegularRecipe
    }
    matchCount
    matchedIngredients {
      id
      name_el
      name_en
    }
    missingUtensils {
      id
      name_el
      name_en
    }
  }
}
